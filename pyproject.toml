[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vkrochik-slo_blame_chain_ratio_calc"
version = "0.1.0"
description = "从输入中抽取数值，计算算子库维护工程师·SLO 违约的归因链路相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vkrochik" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://vkrochik.github.io"
Repository = "https://github.com/vkrochik/slo_blame_chain_ratio_calc"
Issues = "https://github.com/vkrochik/slo_blame_chain_ratio_calc/issues"

[project.scripts]
slo_blame_chain_ratio_calc = "slo_blame_chain_ratio_calc:main"

[tool.setuptools]
py-modules = ["slo_blame_chain_ratio_calc"]
